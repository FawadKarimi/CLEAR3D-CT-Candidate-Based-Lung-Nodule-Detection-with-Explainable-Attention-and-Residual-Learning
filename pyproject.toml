[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lidc3d-research"
version = "0.1.0"
description = "Independent two-stage 3D LIDC-IDRI research pipeline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.11,<2", "torch>=2.4,<3", "pydicom>=2.4,<4", "scikit-image>=0.22,<1", "scikit-learn>=1.3,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
lidc3d = "lidc3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
